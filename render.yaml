services:
  - type: web
    name: hiver-support-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
    plan: free
    healthCheckPath: /
